# Documentation of libYGP on GitHub Pages
#
# Pushing to the default branch of the repository
#   1. generates the Doxygen documentation of YGP and XGP (meson compile -C build doc)
#   2. publishes it together with doc/index.html on GitHub Pages
#
# Note: The Pages of the repository must use "GitHub Actions" as source
#       (Settings -> Pages -> Build and deployment -> Source).

name: Documentation

on:
  push:
    paths:
      - 'YGP/**'
      - 'XGP/**'
      - 'doc/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# Only one deployment at a time; don't cancel a running one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Branch filters can't refer to the default branch; check it here
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    container: fedora:45
    defaults:
      run:
        shell: bash
    steps:
      - name: Install dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
              gcc gcc-c++ meson ninja-build git tar boost-devel openssl-devel \
              doxygen graphviz

      - uses: actions/checkout@v5

      # Doxygen only parses the sources; so the optional libraries aren't needed
      - name: Generate documentation
        run: |
          meson setup build -Dxgp=disabled -Dnls=disabled
          meson compile -C build doc

      # index.html refers to some files of the top-directory (../COPYING)
      - name: Assemble site
        run: |
          mkdir _site
          cp -r doc/YGP doc/XGP COPYING INSTALL _site/
          sed 's|href="\.\./|href="|g' doc/index.html > _site/index.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
